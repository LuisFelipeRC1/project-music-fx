services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: musicxd
      POSTGRES_USER: musicxd
      POSTGRES_PASSWORD: musicxd_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicxd"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./musicxd.api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=musicxd;Username=musicxd;Password=musicxd_dev"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Secret: "${JWT_SECRET:-change-me-in-production-use-a-long-random-string}"
      Jwt__Issuer: "musicxd-api"
      Jwt__Audience: "musicxd-web"
      Spotify__ClientId: "${Spotify__ClientId}"
      Spotify__ClientSecret: "${Spotify__ClientSecret}"

  web:
    build:
      context: ./musicxd.web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000"

volumes:
  postgres_data:

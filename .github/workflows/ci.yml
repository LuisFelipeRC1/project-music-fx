name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-ci:
    name: Backend CI (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./musicxd.api
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore MusicXD.sln

      - name: Build
        run: dotnet build MusicXD.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test MusicXD.sln --no-build --configuration Release --verbosity normal

  frontend-ci:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./musicxd.web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # cache-dependency-path is always relative to the repo root,
          # regardless of defaults.run.working-directory above.
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
